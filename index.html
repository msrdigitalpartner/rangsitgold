<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รังสิตหลอมทอง — รับซื้อทอง เงิน นาก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-bg">
        <div class="container">

            <!-- Corner Ornaments -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <!-- Header -->
            <header class="header">
                <div class="emblem">
                    <img src="logo.jpg" alt="รังสิตหลอมทอง">
                </div>
                <h1 class="brand-name">รังสิตหลอมทอง</h1>
                <p class="brand-tagline">รับซื้อ&nbsp;·&nbsp;ทอง&nbsp;·&nbsp;เงิน&nbsp;·&nbsp;นาก</p>
            </header>

            <!-- Divider -->
            <div class="ornament-divider">
                <span class="line"></span>
                <span class="diamond">◆</span>
                <span class="line"></span>
            </div>

            <!-- Selling Points -->
            <section class="selling-points">
                <p class="headline">รับซื้อทอง เงิน นากทุกชนิด</p>
                <ul class="benefits">
                    <li>
                        <span class="check">✦</span>
                        ให้ราคาตามทองแท่ง
                    </li>
                    <li>
                        <span class="check">✦</span>
                        ไม่หักค่าหลอม
                    </li>
                    <li>
                        <span class="check">✦</span>
                        ไม่คิดค่าบริการ
                    </li>
                </ul>
            </section>

            <!-- Divider -->
            <div class="ornament-divider slim">
                <span class="line"></span>
                <span class="diamond">◇</span>
                <span class="line"></span>
            </div>

            <!-- Location -->
            <section class="location-section">
                <a href="https://maps.app.goo.gl/Nvg6E9wcWYLoEpxt5?g_st=ic" target="_blank" rel="noopener" class="location-link">
                    <svg class="pin-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    <span class="location-text">
                        ตลาด 200ปี รังสิต
                        <small>มีที่จอดรถ — แตะเพื่อดูแผนที่</small>
                    </span>
                </a>
            </section>

            <!-- CTA Buttons -->
            <section class="cta-section">
                <a href="https://lin.ee/q2MItLn" target="_blank" rel="noopener" class="btn btn-line">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.121.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967C23.167 13.296 24 11.36 24 10.304z"/>
                    </svg>
                    แอดไลน์
                </a>
                <a href="tel:0617946562" class="btn btn-call">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                    โทรหาเรา
                </a>
            </section>

            <!-- Footer -->
            <footer class="footer">
                <div class="ornament-divider slim">
                    <span class="line"></span>
                    <span class="diamond">◇</span>
                    <span class="line"></span>
                </div>
                <p>เปิดบริการจันทร์–เสาร์ &nbsp;|&nbsp; 09.00–17.30 น.</p>
                <p class="footer-sub">แวะมาได้เลย ไม่ต้องจองคิว</p>
            </footer>

        </div>
    </div>
</body>
</html>
